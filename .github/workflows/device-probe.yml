name: iPhone share probe IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bluesky-social/social-app
          ref: '46d98dd457a197cee8502863b420222508f29fa6'
          path: upstream
          persist-credentials: false
      - name: Generate app with real share extension
        run: |
          xcodebuild -version
          gem install xcodeproj --version 1.28.1 --user-install --no-document
          git -C upstream apply --check ../share-text-url.patch
          git -C upstream apply ../share-text-url.patch
          ruby device-probe/generate-project.rb upstream
      - name: Check profile diagnostics parser
        shell: bash
        run: |
          set -euo pipefail
          probe_fixture=$(mktemp -d)
          trap 'rm -rf "$probe_fixture"' EXIT
          cat > "$probe_fixture/groups.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict><key>Entitlements</key><dict><key>com.apple.security.application-groups</key><array><string>group.org.sino87.clipboardprobe</string></array></dict></dict></plist>
          PLIST
          openssl req -newkey rsa:2048 -nodes -x509 -days 1 -subj '/CN=ProbeFixture' \
            -keyout "$probe_fixture/key.pem" -out "$probe_fixture/cert.pem" 2>/dev/null
          openssl cms -sign -binary -nodetach -outform DER \
            -in "$probe_fixture/groups.plist" -signer "$probe_fixture/cert.pem" \
            -inkey "$probe_fixture/key.pem" -out "$probe_fixture/profile.cms"
          swiftc device-probe/ProfileDiagnostics.swift device-probe/ProbeStore.swift device-probe/profile-tests/main.swift -o "$probe_fixture/check"
          "$probe_fixture/check" "$probe_fixture/profile.cms"
      - name: Build unsigned iPhone archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results/device-probe
          xcodebuild archive \
            -project generated/device-probe/ClipboardDeviceProbe.xcodeproj \
            -scheme ClipboardDeviceProbe \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath generated/device-probe/ClipboardDeviceProbe.xcarchive \
            -derivedDataPath DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            2>&1 | tee results/device-probe/device-build.log
          app=generated/device-probe/ClipboardDeviceProbe.xcarchive/Products/Applications/ClipboardDeviceProbe.app
          codesign --force --sign - --generate-entitlement-der \
            --entitlements generated/device-probe/Probe.entitlements "$app/PlugIns/ClipboardProbeShare.appex"
          codesign --force --sign - --generate-entitlement-der \
            --entitlements generated/device-probe/Probe.entitlements "$app"
          python3 device-probe/package-ipa.py generated/device-probe/ClipboardDeviceProbe.xcarchive results/device-probe
          cp generated/device-probe/Probe.entitlements results/device-probe/requested-entitlements.plist
      - name: Build and inspect simulator UI
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project generated/device-probe/ClipboardDeviceProbe.xcodeproj \
            -scheme ClipboardDeviceProbe \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath DerivedDataDeviceSimulator \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee results/device-probe/simulator-build.log
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [device for runtime, group in devices.items() if "iOS" in runtime for device in group if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not phones:
              raise SystemExit("No available iPhone simulator")
          print(phones[0]["udid"])
          ')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" DerivedDataDeviceSimulator/Build/Products/Debug-iphonesimulator/ClipboardDeviceProbe.app
          xcrun simctl launch "$device_id" org.sino87.clipboardprobe
          sleep 3
          xcrun simctl io "$device_id" screenshot results/device-probe/simulator-ui.png
      - name: Preserve IPA, build evidence, and setup guide
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: iphone-share-probe
          path: |
            results/device-probe/
            device-probe/README.md
          retention-days: 1
          if-no-files-found: warn
