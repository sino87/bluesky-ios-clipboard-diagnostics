name: iOS clipboard diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '1.135.0'
            repository: sino87/social-app
            ref: '70271fa73dc593bc53a96a1c4d05e4a7f1ac73a4'
            variant: encoding-baseline
          - version: '1.135.0'
            repository: bluesky-social/social-app
            ref: '46d98dd457a197cee8502863b420222508f29fa6'
            variant: fixed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Test receiver verification
        env:
          BLUESKY_SOURCE_ROOT: upstream
        run: node --test verify-compose-links.test.mjs
      - name: Record Xcode and Simulator versions
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available
      - name: Generate the test project
        run: |
          gem install xcodeproj --version 1.28.1 --user-install --no-document
          if [ "${{ matrix.variant }}" = fixed ]; then
            git -C upstream apply --check ../share-text-url.patch
            git -C upstream apply ../share-text-url.patch
          fi
          ruby generate-project.rb upstream
      - name: Run native diagnostics
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          device_id=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          iphones = [device for runtime, group in devices.items() if "iOS" in runtime for device in group if device.get("isAvailable") and device["name"].startswith("iPhone")]
          if not iphones:
              raise SystemExit("No available iPhone simulator")
          print(iphones[0]["udid"])
          ')
          echo "Selected iPhone simulator: $device_id"
          xcrun simctl list devices available | grep "$device_id"
          xcodebuild test \
            -project generated/ClipboardDiagnostics.xcodeproj \
            -scheme ClipboardDiagnostics \
            -destination "platform=iOS Simulator,id=$device_id" \
            -derivedDataPath DerivedData \
            -resultBundlePath results/diagnostics.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 30 \
            -maximum-test-execution-time-allowance 60 \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee results/xcodebuild.log
      - name: Verify native compose links in the Bluesky receiver
        if: ${{ !cancelled() }}
        run: node verify-compose-links.mjs results/xcodebuild.log upstream
      - name: Preserve test output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: clipboard-diagnostics-${{ matrix.version }}-${{ matrix.variant }}
          path: results/xcodebuild.log
          retention-days: 1
          if-no-files-found: warn
