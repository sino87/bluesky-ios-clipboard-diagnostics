name: Bluesky project checks

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bluesky-social/social-app
          ref: '46d98dd457a197cee8502863b420222508f29fa6'
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '11.28.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Apply the share fix
        run: |
          git -C upstream apply --check ../share-text-url.patch
          git -C upstream apply ../share-text-url.patch
      - name: Install pinned dependencies
        id: install
        working-directory: upstream
        run: pnpm install --frozen-lockfile
      - name: Generate translations in CI
        id: translations
        working-directory: upstream
        run: pnpm intl:build
      - name: Lint
        working-directory: upstream
        run: pnpm lint
      - name: Typecheck all platforms
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.translations.outcome == 'success' }}
        working-directory: upstream
        run: pnpm typecheck
