name: Bluesky iPhone verification build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: Share controller variant
        type: choice
        options: [fixed, baseline]
        default: fixed

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_PUBLIC_ENV: production
      EAS_BUILD_PLATFORM: ios
      DISABLE_UPDATES: '1'
      BUILD_VARIANT: ${{ inputs.variant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bluesky-social/social-app
          ref: '46d98dd457a197cee8502863b420222508f29fa6'
          path: upstream
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: '11.28.5'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.19.0'
      - name: Prepare isolated verification configuration
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          if [ '${{ inputs.variant }}' = fixed ]; then
            git -C upstream apply --check ../share-text-url.patch
            git -C upstream apply ../share-text-url.patch
          fi
          node bluesky-build/prepare.cjs upstream
      - name: Install dependencies and generate native project
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          node ../bluesky-build/check-config.cjs .
          pnpm intl:build
          pnpm prebuild --platform ios --no-install
          gem install xcodeproj --version 1.28.1 --user-install --no-document
          ruby ../bluesky-build/configure-project.rb .
          cd ios
          pod install
      - name: Archive actual Bluesky app
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../results/bluesky-device
          xcodebuild archive \
            -workspace ios/BlueskyShareTest.xcworkspace \
            -scheme BlueskyShareTest -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../generated/BlueskyShareTest.xcarchive \
            -derivedDataPath ../generated/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            2>&1 | tee ../results/bluesky-device/archive.log
      - name: Package and inspect iPhone IPA
        run: |
          python3 bluesky-build/package.py generated/BlueskyShareTest.xcarchive results/bluesky-device
          cp upstream/verification-config.json results/bluesky-device/
      - name: Preserve IPA and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bluesky-iphone-${{ inputs.variant }}
          path: results/bluesky-device/
          retention-days: 1
          if-no-files-found: warn
